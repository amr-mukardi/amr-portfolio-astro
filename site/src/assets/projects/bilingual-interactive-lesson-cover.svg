<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1a1f2b" />
      <stop offset="100%" stop-color="#0a0e14" />
    </radialGradient>

    <!-- Title text gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="50%" stop-color="#a29bfe" />
      <stop offset="100%" stop-color="#4ecdc4" />
    </linearGradient>

    <!-- Subtle accent gradient for decorative circle -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow filter for badge shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)" />

  <!-- Decorative circles -->
  <circle cx="150" cy="80" r="120" fill="url(#accentGrad)" opacity="0.4" />
  <circle cx="680" cy="320" r="160" fill="url(#accentGrad)" opacity="0.25" />
  <circle cx="400" cy="200" r="3" fill="#ffffff" opacity="0.1" />
  <circle cx="250" cy="300" r="2" fill="#ffffff" opacity="0.1" />
  <circle cx="600" cy="100" r="2.5" fill="#ffffff" opacity="0.1" />

  <!-- ECG heartbeat line (subtle) -->
  <path d="M 0,360 L 100,360 L 130,360 L 150,250 L 170,380 L 190,360 L 800,360" 
        fill="none" stroke="#4ecdc4" stroke-width="2" stroke-opacity="0.15" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Title -->
  <text x="400" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="800" 
        fill="url(#titleGrad)" text-anchor="middle" letter-spacing="-0.5">
    Bilingual Interactive Experience
  </text>

  <!-- Subtitle / Description -->
  <text x="400" y="155" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" 
        fill="#a0a8b8" text-anchor="middle">
    Journey Through the Human Body — An Immersive Learning Story
  </text>

  <!-- Technology badges row -->
  <g transform="translate(400, 205)" text-anchor="middle">
    <!-- HTML badge -->
    <rect x="-160" y="-14" width="70" height="28" rx="14" fill="#1a1f2b" stroke="#ff6b6b" stroke-width="1.5" filter="url(#glow)"/>
    <text x="-125" y="5" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#ff6b6b">HTML</text>

    <!-- CSS badge -->
    <rect x="-35" y="-14" width="70" height="28" rx="14" fill="#1a1f2b" stroke="#a29bfe" stroke-width="1.5" filter="url(#glow)"/>
    <text x="0" y="5" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#a29bfe">CSS</text>

    <!-- JavaScript badge -->
    <rect x="90" y="-14" width="100" height="28" rx="14" fill="#1a1f2b" stroke="#ffe66d" stroke-width="1.5" filter="url(#glow)"/>
    <text x="140" y="5" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#ffe66d">JavaScript</text>
  </g>

  <!-- Bilingual indicator with globe icons -->
  <g transform="translate(400, 270)" text-anchor="middle">
    <!-- Globe left (EN) -->
    <circle cx="-60" cy="0" r="18" fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.8"/>
    <ellipse cx="-60" cy="0" rx="8" ry="18" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.6"/>
    <line x1="-78" y1="0" x2="-42" y2="0" stroke="#4ecdc4" stroke-width="1" opacity="0.6"/>
    <text x="-60" y="4" font-family="'Segoe UI', Arial, sans-serif" font-size="8" font-weight="700" fill="#4ecdc4" text-anchor="middle">EN</text>

    <!-- EN text -->
    <text x="-60" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#e0e4ec" text-anchor="middle">English</text>

    <!-- Globe right (AR) -->
    <circle cx="60" cy="0" r="18" fill="none" stroke="#ff6b6b" stroke-width="1.5" opacity="0.8"/>
    <ellipse cx="60" cy="0" rx="8" ry="18" fill="none" stroke="#ff6b6b" stroke-width="1" opacity="0.6"/>
    <line x1="42" y1="0" x2="78" y2="0" stroke="#ff6b6b" stroke-width="1" opacity="0.6"/>
    <text x="60" y="4" font-family="'Segoe UI', Arial, sans-serif" font-size="8" font-weight="700" fill="#ff6b6b" text-anchor="middle">AR</text>

    <!-- AR text -->
    <text x="60" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#e0e4ec" text-anchor="middle">العربية</text>
  </g>

  <!-- Full-Stack Developer badge (bottom) -->
  <g transform="translate(400, 345)">
    <rect x="-110" y="-14" width="220" height="28" rx="14" fill="#111720" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    <text x="0" y="4" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#a0a8b8" text-anchor="middle">
      FULL‑STACK DEVELOPER PORTFOLIO PIECE
    </text>
  </g>

  <!-- Small heart icon (bottom-left) -->
  <g transform="translate(75, 350)" opacity="0.3">
    <path d="M0,6 A6,6 0 0,1 12,0 A6,6 0 0,1 24,6 Q24,14 12,22 Q0,14 0,6 Z" fill="#ff6b6b" />
  </g>

  <!-- Small brain icon (bottom-right) -->
  <g transform="translate(690, 345)" opacity="0.3">
    <path d="M20,15 Q20,5 12,5 Q4,5 4,12 Q4,18 10,20 Q14,22 14,14 Q14,8 8,8 Q6,8 6,10 M10,20 L10,24 M6,12 L2,10 M18,12 L22,10" stroke="#a29bfe" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Footer note -->
  <text x="400" y="385" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#a0a8b8" text-anchor="middle" opacity="0.5">
    Bilingual · Interactive · Storytelling · HTML/CSS/JS · RTL Support
  </text>
</svg>