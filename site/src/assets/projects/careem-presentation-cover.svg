<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="68%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#0f1a15" />
      <stop offset="40%" stop-color="#0d1316" />
      <stop offset="100%" stop-color="#090c0f" />
    </radialGradient>
    
    <!-- Green Atmospheric Glow -->
    <radialGradient id="greenAtmo" cx="70%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#00D562" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#00D562" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#00D562" stop-opacity="0" />
    </radialGradient>
    
    <!-- Secondary Blue Glow -->
    <radialGradient id="blueAtmo" cx="20%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#00A9E0" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#00A9E0" stop-opacity="0" />
    </radialGradient>
    
    <!-- Card Gradients -->
    <linearGradient id="cardBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1f25" />
      <stop offset="100%" stop-color="#15191e" />
    </linearGradient>
    <linearGradient id="cardMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e242b" />
      <stop offset="100%" stop-color="#181d23" />
    </linearGradient>
    <linearGradient id="cardFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232a32" />
      <stop offset="100%" stop-color="#1c2128" />
    </linearGradient>
    
    <!-- Green Accent Gradient -->
    <linearGradient id="greenAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D562" />
      <stop offset="100%" stop-color="#00b84f" />
    </linearGradient>
    
    <!-- Green Glow Filter -->
    <filter id="greenGlowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Subtle Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    
    <filter id="cardShadowLight" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    
    <!-- Dot Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#ffffff" opacity="0.04" />
    </pattern>
    
    <!-- Diagonal Line Pattern -->
    <pattern id="diagonalLines" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="60" stroke="#00D562" stroke-width="0.5" opacity="0.03" />
    </pattern>
  </defs>
  
  <!-- ============ BACKGROUND ============ -->
  <rect width="1200" height="675" fill="url(#bgGlow)" />
  <rect width="1200" height="675" fill="url(#greenAtmo)" />
  <rect width="1200" height="675" fill="url(#blueAtmo)" />
  <rect width="1200" height="675" fill="url(#dotGrid)" />
  <rect width="1200" height="675" fill="url(#diagonalLines)" />
  
  <!-- Subtle Vignette Overlay -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="transparent" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0.5" />
  </radialGradient>
  <rect width="1200" height="675" fill="url(#vignette)" />
  
  <!-- ============ DECORATIVE ELEMENTS ============ -->
  <!-- Subtle geometric ring -->
  <circle cx="830" cy="310" r="180" fill="none" stroke="#00D562" stroke-width="0.6" opacity="0.08" />
  <circle cx="830" cy="310" r="220" fill="none" stroke="#00D562" stroke-width="0.4" opacity="0.05" />
  <circle cx="830" cy="310" r="260" fill="none" stroke="#00D562" stroke-width="0.3" opacity="0.03" />
  
  <!-- Small decorative dots near cards -->
  <circle cx="520" cy="200" r="3" fill="#00D562" opacity="0.3" />
  <circle cx="530" cy="215" r="1.5" fill="#00D562" opacity="0.2" />
  <circle cx="510" cy="440" r="2" fill="#00D562" opacity="0.25" />
  <circle cx="525" cy="430" r="1" fill="#00A9E0" opacity="0.2" />
  
  <!-- ============ RIGHT SIDE: PRESENTATION CARD MOCKUP ============ -->
  <g>
    <!-- Back Card -->
    <g transform="translate(605, 148) rotate(-3, 150, 100)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="310" height="200" rx="18" fill="url(#cardBack)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <!-- Subtle content hint -->
      <rect x="24" y="30" width="180" height="8" rx="4" fill="rgba(255,255,255,0.06)" />
      <rect x="24" y="50" width="140" height="6" rx="3" fill="rgba(255,255,255,0.04)" />
      <rect x="24" y="65" width="160" height="6" rx="3" fill="rgba(255,255,255,0.04)" />
      <rect x="24" y="80" width="120" height="6" rx="3" fill="rgba(255,255,255,0.03)" />
    </g>
    
    <!-- Middle Card -->
    <g transform="translate(588, 130) rotate(1.5, 150, 100)" filter="url(#cardShadowLight)">
      <rect x="0" y="0" width="310" height="200" rx="18" fill="url(#cardMid)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <!-- Content hint -->
      <rect x="24" y="28" width="200" height="9" rx="4.5" fill="rgba(255,255,255,0.08)" />
      <rect x="24" y="52" width="150" height="6" rx="3" fill="rgba(255,255,255,0.05)" />
      <rect x="24" y="67" width="170" height="6" rx="3" fill="rgba(255,255,255,0.05)" />
      <rect x="24" y="82" width="130" height="6" rx="3" fill="rgba(255,255,255,0.04)" />
      <circle cx="24" cy="54" r="4" fill="#00D562" opacity="0.35" />
      <circle cx="24" cy="69" r="4" fill="#00D562" opacity="0.25" />
    </g>
    
    <!-- Front Card (Main) -->
    <g transform="translate(568, 110) rotate(5, 155, 105)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="320" height="210" rx="20" fill="url(#cardFront)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" />
      
      <!-- Glass reflection hint -->
      <rect x="0" y="0" width="320" height="105" rx="20" fill="url(#greenAccent)" opacity="0.03" />
      
      <!-- Green accent bar at top -->
      <rect x="0" y="0" width="320" height="5" rx="2.5" fill="url(#greenAccent)" opacity="0.9" />
      
      <!-- Slide progress bar -->
      <rect x="20" y="20" width="280" height="3" rx="1.5" fill="rgba(255,255,255,0.06)" />
      <rect x="20" y="20" width="85" height="3" rx="1.5" fill="url(#greenAccent)" opacity="0.7" />
      
      <!-- Slide content representation -->
      <!-- Icon placeholder -->
      <rect x="20" y="38" width="28" height="28" rx="8" fill="rgba(0,213,98,0.15)" stroke="rgba(0,213,98,0.3)" stroke-width="1" />
      <text x="34" y="57" font-family="sans-serif" font-size="14" fill="#00D562" text-anchor="middle" opacity="0.8">📌</text>
      
      <!-- Title line -->
      <rect x="58" y="40" width="180" height="10" rx="5" fill="rgba(255,255,255,0.18)" />
      <rect x="58" y="56" width="120" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
      
      <!-- Body text lines with bullet points -->
      <circle cx="22" cy="90" r="3.5" fill="#00D562" opacity="0.7" />
      <rect x="34" y="86" width="200" height="6" rx="3" fill="rgba(255,255,255,0.09)" />
      
      <circle cx="22" cy="108" r="3.5" fill="#00D562" opacity="0.55" />
      <rect x="34" y="104" width="170" height="6" rx="3" fill="rgba(255,255,255,0.07)" />
      
      <circle cx="22" cy="126" r="3.5" fill="#00D562" opacity="0.4" />
      <rect x="34" y="122" width="190" height="6" rx="3" fill="rgba(255,255,255,0.06)" />
      
      <circle cx="22" cy="144" r="3.5" fill="#00D562" opacity="0.3" />
      <rect x="34" y="140" width="150" height="6" rx="3" fill="rgba(255,255,255,0.05)" />
      
      <!-- Small stat boxes hint -->
      <rect x="20" y="162" width="62" height="34" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="0.8" />
      <rect x="26" y="170" width="24" height="6" rx="3" fill="#00D562" opacity="0.6" />
      <rect x="26" y="180" width="36" height="4" rx="2" fill="rgba(255,255,255,0.08)" />
      
      <rect x="90" y="162" width="62" height="34" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="0.8" />
      <rect x="96" y="170" width="20" height="6" rx="3" fill="#00D562" opacity="0.5" />
      <rect x="96" y="180" width="40" height="4" rx="2" fill="rgba(255,255,255,0.07)" />
      
      <rect x="160" y="162" width="62" height="34" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="0.8" />
      <rect x="166" y="170" width="28" height="6" rx="3" fill="#00D562" opacity="0.45" />
      <rect x="166" y="180" width="32" height="4" rx="2" fill="rgba(255,255,255,0.06)" />
    </g>
    
    <!-- Navigation arrows hint -->
    <g opacity="0.3">
      <text x="530" y="340" font-family="sans-serif" font-size="18" fill="#ffffff" opacity="0.5">❮</text>
      <text x="910" y="340" font-family="sans-serif" font-size="18" fill="#ffffff" opacity="0.5">❯</text>
    </g>
    
    <!-- Slide counter badge -->
    <rect x="810" y="375" width="80" height="28" rx="14" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="850" y="394" font-family="'Poppins', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="1">10 Slides</text>
  </g>
  
  <!-- ============ LEFT SIDE: TEXT CONTENT ============ -->
  <g>
    <!-- Small label -->
    <rect x="70" y="88" width="160" height="26" rx="13" fill="rgba(0,213,98,0.1)" stroke="rgba(0,213,98,0.25)" stroke-width="1" />
    <text x="150" y="106" font-family="'Poppins', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#00D562" text-anchor="middle" letter-spacing="2.5">PORTFOLIO PROJECT</text>
    
    <!-- Main Title -->
    <text x="70" y="175" font-family="'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
      Careem
    </text>
    
    <!-- Green underline accent -->
    <rect x="70" y="190" width="100" height="4" rx="2" fill="url(#greenAccent)" filter="url(#greenGlowFilter)" opacity="0.8" />
    
    <!-- Subtitle -->
    <text x="72" y="235" font-family="'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#d1d5db" letter-spacing="-0.5">
      Case Study
    </text>
    <text x="72" y="262" font-family="'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#00D562" letter-spacing="1.5">
      INTERACTIVE PRESENTATION
    </text>
    
    <!-- Description -->
    <g transform="translate(72, 300)">
      <text x="0" y="0" font-family="'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" fill="#aeb2b8" line-height="1.7">
        <tspan x="0" dy="0">A sophisticated bilingual presentation</tspan>
        <tspan x="0" dy="24">exploring Careem's remarkable journey</tspan>
        <tspan x="0" dy="24">— from a Dubai startup to a</tspan>
        <tspan x="0" dy="24">$3.1 billion regional tech leader.</tspan>
      </text>
    </g>
    
    <!-- Separator line -->
    <line x1="72" y1="425" x2="350" y2="425" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <!-- Tech Stack Badges -->
    <g transform="translate(70, 455)">
      <!-- HTML5 Badge -->
      <rect x="0" y="0" width="82" height="32" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(0,213,98,0.35)" stroke-width="1.2" />
      <text x="41" y="21" font-family="'Poppins', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">HTML5</text>
      
      <!-- CSS3 Badge -->
      <rect x="92" y="0" width="72" height="32" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(0,213,98,0.35)" stroke-width="1.2" />
      <text x="128" y="21" font-family="'Poppins', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">CSS3</text>
      
      <!-- JavaScript Badge -->
      <rect x="174" y="0" width="92" height="32" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(0,213,98,0.35)" stroke-width="1.2" />
      <text x="220" y="21" font-family="'Poppins', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">JavaScript</text>
      
      <!-- Bilingual Badge -->
      <rect x="276" y="0" width="110" height="32" rx="16" fill="rgba(0,213,98,0.1)" stroke="rgba(0,213,98,0.5)" stroke-width="1.2" />
      <text x="331" y="21" font-family="'Poppins', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#00D562" text-anchor="middle">🌐 EN / AR</text>
    </g>
  </g>
  
  <!-- ============ BOTTOM ACCENT LINE ============ -->
  <rect x="70" y="635" width="400" height="2" rx="1" fill="url(#greenAccent)" opacity="0.5" />
  <circle cx="470" cy="636" r="4" fill="#00D562" opacity="0.7" filter="url(#greenGlowFilter)" />
  
  <!-- ============ DESIGNER CREDIT ============ -->
  <text x="1140" y="660" font-family="'Poppins', 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="500" fill="rgba(255,255,255,0.2)" text-anchor="end" letter-spacing="0.5">
    Designed by AMR AL-MUKARDI — Presentation Architect
  </text>
  
  <!-- ============ TOP CORNER ACCENT ============ -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#greenAccent)" opacity="0.4" />
</svg>