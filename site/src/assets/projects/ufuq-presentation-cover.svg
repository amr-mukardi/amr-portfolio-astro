<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <!-- تدرجات الخلفية -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#141c2b"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#080d1f"/>
    </radialGradient>

    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#c9a84c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="skyGlow" cx="30%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#4cc9f0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4cc9f0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0c878"/>
      <stop offset="35%" stop-color="#c9a84c"/>
      <stop offset="65%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b8922f"/>
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d878"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>

    <linearGradient id="goldHoriz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0"/>
      <stop offset="30%" stop-color="#c9a84c" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#c9a84c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#c9a84c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="goldShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
      <feOffset dx="0" dy="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <pattern id="gridPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <line x1="0" y1="60" x2="60" y2="60" stroke="#c9a84c" stroke-width="0.3" opacity="0.04"/>
      <line x1="60" y1="0" x2="60" y2="60" stroke="#c9a84c" stroke-width="0.3" opacity="0.04"/>
    </pattern>

    <!-- أيقونة HTML5 بسيطة -->
    <g id="iconHtml">
      <polygon points="8,4 32,4 30,28 20,31 10,28" fill="#e34f26"/>
      <polygon points="10,4 30,4 28.5,24 20,26.5 11.5,24" fill="#f06529"/>
      <line x1="15" y1="10" x2="25" y2="10" stroke="#fff" stroke-width="2"/>
      <line x1="14" y1="14" x2="26" y2="14" stroke="#fff" stroke-width="2"/>
      <line x1="13" y1="18" x2="24" y2="18" stroke="#fff" stroke-width="2"/>
      <line x1="16" y1="22" x2="20" y2="22" stroke="#fff" stroke-width="1.5"/>
    </g>

    <!-- أيقونة CSS3 -->
    <g id="iconCss">
      <polygon points="8,4 32,4 30,28 20,31 10,28" fill="#1572b6"/>
      <polygon points="10,4 30,4 28.5,24 20,26.5 11.5,24" fill="#33a9dc"/>
      <rect x="14" y="10" width="12" height="2" fill="#fff"/>
      <rect x="13" y="14" width="14" height="2" fill="#fff"/>
      <rect x="15" y="18" width="10" height="2" fill="#fff"/>
      <rect x="17" y="22" width="6" height="2" fill="#fff"/>
    </g>

    <!-- أيقونة JavaScript -->
    <g id="iconJs">
      <rect x="6" y="4" width="28" height="28" rx="4" fill="#f7df1e"/>
      <text x="20" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#000">JS</text>
    </g>

    <!-- أيقونة Chart.js -->
    <g id="iconChart">
      <rect x="6" y="6" width="28" height="24" rx="4" fill="none" stroke="#ff6384" stroke-width="2"/>
      <rect x="10" y="18" width="4" height="8" rx="1" fill="#ff6384"/>
      <rect x="16" y="12" width="4" height="14" rx="1" fill="#36a2eb"/>
      <rect x="22" y="15" width="4" height="11" rx="1" fill="#ffce56"/>
    </g>

    <!-- أيقونة Leaflet.js (خريطة) -->
    <g id="iconLeaflet">
      <circle cx="20" cy="18" r="12" fill="#77b300" opacity="0.9"/>
      <circle cx="20" cy="18" r="8" fill="#a1d148"/>
      <path d="M20,6 L20,30 M8,18 L32,18" stroke="#555" stroke-width="1.5" opacity="0.3"/>
    </g>
  </defs>

  <!-- ====== الخلفية الأساسية ====== -->
  <rect width="1200" height="750" fill="url(#bgGlow)"/>
  <rect width="1200" height="750" fill="url(#gridPattern)"/>

  <!-- توهجات خلفية -->
  <ellipse cx="600" cy="280" rx="500" ry="350" fill="url(#goldGlow)"/>
  <ellipse cx="350" cy="480" rx="400" ry="250" fill="url(#skyGlow)"/>

  <!-- نقاط خلفية زخرفية -->
  <g opacity="0.04">
    <circle cx="80" cy="100" r="2" fill="#c9a84c"/>
    <circle cx="200" cy="60" r="1.5" fill="#c9a84c"/>
    <circle cx="350" cy="120" r="2.5" fill="#c9a84c"/>
    <circle cx="900" cy="80" r="2" fill="#c9a84c"/>
    <circle cx="1050" cy="140" r="1.8" fill="#c9a84c"/>
    <circle cx="1120" cy="60" r="2.2" fill="#c9a84c"/>
    <circle cx="150" cy="560" r="2" fill="#c9a84c"/>
    <circle cx="1020" cy="520" r="2.5" fill="#c9a84c"/>
    <circle cx="1100" cy="580" r="1.8" fill="#c9a84c"/>
    <circle cx="50" cy="400" r="1.5" fill="#4cc9f0"/>
    <circle cx="1150" cy="350" r="2" fill="#4cc9f0"/>
  </g>

  <!-- ====== القسم العلوي: الهوية والعنوان ====== -->

  <!-- الدائرة الذهبية المركزية -->
  <g transform="translate(180, 315)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.3">
      <animate attributeName="r" values="75;85;75" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#c9a84c" stroke-width="0.5" opacity="0.15">
      <animate attributeName="r" values="95;110;95" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="62" fill="url(#goldGrad)" filter="url(#goldShadow)"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="#e0c878" stroke-width="2" opacity="0.6"/>
    <text x="0" y="-8" text-anchor="middle" fill="#0d1b2a" font-family="Poppins, Tajawal, sans-serif" font-size="36" font-weight="900" letter-spacing="3">افق</text>
    <text x="0" y="24" text-anchor="middle" fill="#0d1b2a" font-family="Poppins, sans-serif" font-size="13" font-weight="600" letter-spacing="4" opacity="0.7">UFUQ</text>
  </g>

  <!-- خطوط زخرفية -->
  <g opacity="0.3">
    <line x1="248" y1="315" x2="320" y2="315" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <line x1="248" y1="295" x2="310" y2="250" stroke="url(#goldGrad)" stroke-width="0.8"/>
    <line x1="248" y1="335" x2="310" y2="380" stroke="url(#goldGrad)" stroke-width="0.8"/>
  </g>

  <!-- العنوان الرئيسي (مع عربية جزئية) -->
  <g transform="translate(340, 270)">
    <text x="0" y="0" fill="#e8eaed" font-family="Poppins, Tajawal, sans-serif" font-size="42" font-weight="900" letter-spacing="-1">
      Harvest of <tspan fill="url(#goldGrad)" font-size="48">2025</tspan>
    </text>
    <text x="0" y="40" fill="#8892a4" font-family="Poppins, sans-serif" font-size="15" font-weight="400" letter-spacing="5">
      AL-UFUQ INVESTMENT GROUP
    </text>
  </g>

  <!-- اسم المجموعة بالعربية (صغير) -->
  <text x="630" y="320" fill="#8892a4" font-family="Tajawal, sans-serif" font-size="11" font-weight="300" letter-spacing="4" opacity="0.5">مجموعة الأفق للاستثمار</text>

  <!-- خط فاصل ذهبي -->
  <line x1="340" y1="345" x2="620" y2="345" stroke="url(#goldHoriz)" stroke-width="1.5"/>

  <!-- وسوم / تاجات (بالإنجليزية) -->
  <g transform="translate(340, 378)">
    <rect x="0" y="0" width="120" height="28" rx="14" fill="none" stroke="#c9a84c" stroke-width="1.2" opacity="0.8"/>
    <text x="60" y="19" text-anchor="middle" fill="#c9a84c" font-family="Poppins, sans-serif" font-size="11" font-weight="500">Interactive Report</text>

    <rect x="130" y="0" width="95" height="28" rx="14" fill="none" stroke="#4cc9f0" stroke-width="1.2" opacity="0.8"/>
    <text x="177.5" y="19" text-anchor="middle" fill="#4cc9f0" font-family="Poppins, sans-serif" font-size="11" font-weight="500">Bilingual</text>

    <rect x="235" y="0" width="105" height="28" rx="14" fill="none" stroke="#c9a84c" stroke-width="1.2" opacity="0.8"/>
    <text x="287.5" y="19" text-anchor="middle" fill="#c9a84c" font-family="Poppins, sans-serif" font-size="11" font-weight="500">Presentation</text>
  </g>

  <!-- ====== الجانب الأيمن: كروت البيانات (بالإنجليزية) ====== -->

  <!-- كرت 1: Revenue Growth -->
  <g transform="translate(740, 140)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="200" height="110" rx="16" fill="url(#glassCard)" stroke="url(#glassBorder)" stroke-width="1.2"/>
    <text x="100" y="32" text-anchor="middle" font-size="26">📈</text>
    <text x="100" y="62" text-anchor="middle" fill="url(#goldGrad)" font-family="Poppins, sans-serif" font-size="28" font-weight="800">35%</text>
    <text x="100" y="88" text-anchor="middle" fill="#8892a4" font-family="Poppins, sans-serif" font-size="11" font-weight="400">Revenue Growth</text>
  </g>

  <!-- كرت 2: New Clients -->
  <g transform="translate(960, 140)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="200" height="110" rx="16" fill="url(#glassCard)" stroke="url(#glassBorder)" stroke-width="1.2"/>
    <text x="100" y="32" text-anchor="middle" font-size="26">👥</text>
    <text x="100" y="62" text-anchor="middle" fill="url(#goldGrad)" font-family="Poppins, sans-serif" font-size="28" font-weight="800">10,000+</text>
    <text x="100" y="88" text-anchor="middle" fill="#8892a4" font-family="Poppins, sans-serif" font-size="11" font-weight="400">New Clients</text>
  </g>

  <!-- كرت 3: New Markets -->
  <g transform="translate(850, 270)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="200" height="110" rx="16" fill="url(#glassCard)" stroke="url(#glassBorder)" stroke-width="1.2"/>
    <text x="100" y="32" text-anchor="middle" font-size="26">🌍</text>
    <text x="100" y="62" text-anchor="middle" fill="url(#goldGrad)" font-family="Poppins, sans-serif" font-size="28" font-weight="800">5</text>
    <text x="100" y="88" text-anchor="middle" fill="#8892a4" font-family="Poppins, sans-serif" font-size="11" font-weight="400">New Markets</text>
  </g>

  <!-- ====== رسم بياني مصغر (زخرفي) ====== -->
  <g transform="translate(740, 440)">
    <rect x="0" y="0" width="420" height="140" rx="14" fill="url(#glassCard)" stroke="url(#glassBorder)" stroke-width="1"/>
    <line x1="45" y1="20" x2="45" y2="125" stroke="#ffffff" stroke-width="0.4" opacity="0.1"/>
    <line x1="45" y1="125" x2="405" y2="125" stroke="#ffffff" stroke-width="0.4" opacity="0.1"/>
    <line x1="45" y1="90" x2="405" y2="90" stroke="#ffffff" stroke-width="0.3" opacity="0.06" stroke-dasharray="4,4"/>
    <line x1="45" y1="55" x2="405" y2="55" stroke="#ffffff" stroke-width="0.3" opacity="0.06" stroke-dasharray="4,4"/>

    <!-- أعمدة الرسم البياني -->
    <rect x="80" y="105" width="45" height="20" rx="4" fill="#4cc9f0" opacity="0.4"/>
    <rect x="135" y="95" width="45" height="30" rx="4" fill="#4cc9f0" opacity="0.5"/>
    <rect x="190" y="82" width="45" height="43" rx="4" fill="#4cc9f0" opacity="0.6"/>
    <rect x="245" y="63" width="45" height="62" rx="4" fill="#c9a84c" opacity="0.7"/>
    <rect x="300" y="35" width="45" height="90" rx="4" fill="#c9a84c" opacity="0.9"/>
    <rect x="300" y="35" width="45" height="90" rx="4" fill="none" stroke="#d4af37" stroke-width="1.5" filter="url(#softGlow)"/>

    <!-- تسميات المحور السيني (إنجليزية) -->
    <text x="102.5" y="135" text-anchor="middle" fill="#8892a4" font-family="Poppins, sans-serif" font-size="9">2021</text>
    <text x="157.5" y="135" text-anchor="middle" fill="#8892a4" font-family="Poppins, sans-serif" font-size="9">2022</text>
    <text x="212.5" y="135" text-anchor="middle" fill="#8892a4" font-family="Poppins, sans-serif" font-size="9">2023</text>
    <text x="267.5" y="135" text-anchor="middle" fill="#8892a4" font-family="Poppins, sans-serif" font-size="9">2024</text>
    <text x="322.5" y="135" text-anchor="middle" fill="#c9a84c" font-family="Poppins, sans-serif" font-size="9" font-weight="600">2025</text>

    <!-- قيمة على العمود الأخير -->
    <text x="322.5" y="30" text-anchor="middle" fill="#d4af37" font-family="Poppins, sans-serif" font-size="12" font-weight="700">$120M</text>
  </g>

  <!-- وصف سفلي (بالإنجليزية) -->
  <g transform="translate(440, 520)">
    <text x="0" y="0" text-anchor="middle" fill="#8892a4" font-family="Poppins, sans-serif" font-size="13" font-weight="300" letter-spacing="0.5">
      Interactive Bilingual Presentation · Dynamic Data Visualization · Live Maps · Responsive Slides
    </text>
    <text x="0" y="22" text-anchor="middle" fill="#8892a4" font-family="Tajawal, sans-serif" font-size="10" font-weight="300" opacity="0.5" letter-spacing="1">
      عرض تفاعلي ثنائي اللغة · رسوم بيانية · خرائط · شرائح متجاوبة
    </text>
  </g>

  <!-- خط زخرفي سفلي -->
  <line x1="100" y1="580" x2="1100" y2="580" stroke="url(#goldHoriz)" stroke-width="0.8"/>

  <!-- ====== شريط التقنيات المستخدمة ====== -->
  <g transform="translate(0, 600)">
    <!-- خلفية الشريط -->
    <rect x="0" y="0" width="1200" height="150" fill="#0a1020" opacity="0.8"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#goldHoriz)" stroke-width="1"/>

    <!-- عنوان القسم -->
    <text x="600" y="30" text-anchor="middle" fill="#c9a84c" font-family="Poppins, sans-serif" font-size="14" font-weight="600" letter-spacing="3">TECH STACK</text>
    <text x="600" y="48" text-anchor="middle" fill="#8892a4" font-family="Tajawal, sans-serif" font-size="10" opacity="0.5">التقنيات المستخدمة</text>

    <!-- خط تحت العنوان -->
    <line x1="520" y1="56" x2="680" y2="56" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>

    <!-- أيقونة HTML5 -->
    <g transform="translate(180, 70)">
      <rect x="-30" y="-28" width="60" height="52" rx="10" fill="url(#glassCard)" stroke="#ffffff" stroke-width="0.5" opacity="0.4"/>
      <use href="#iconHtml" x="-18" y="-16" transform="scale(1.1)"/>
      <text x="0" y="32" text-anchor="middle" fill="#8892a4" font-family="Poppins, sans-serif" font-size="10" font-weight="500">HTML5</text>
    </g>

    <!-- أيقونة CSS3 -->
    <g transform="translate(360, 70)">
      <rect x="-30" y="-28" width="60" height="52" rx="10" fill="url(#glassCard)" stroke="#ffffff" stroke-width="0.5" opacity="0.4"/>
      <use href="#iconCss" x="-18" y="-16" transform="scale(1.1)"/>
      <text x="0" y="32" text-anchor="middle" fill="#8892a4" font-family="Poppins, sans-serif" font-size="10" font-weight="500">CSS3</text>
    </g>

    <!-- أيقونة JavaScript -->
    <g transform="translate(540, 70)">
      <rect x="-30" y="-28" width="60" height="52" rx="10" fill="url(#glassCard)" stroke="#ffffff" stroke-width="0.5" opacity="0.4"/>
      <use href="#iconJs" x="-18" y="-16" transform="scale(1.1)"/>
      <text x="0" y="32" text-anchor="middle" fill="#8892a4" font-family="Poppins, sans-serif" font-size="10" font-weight="500">JavaScript</text>
    </g>

    <!-- أيقونة Chart.js -->
    <g transform="translate(720, 70)">
      <rect x="-30" y="-28" width="60" height="52" rx="10" fill="url(#glassCard)" stroke="#ffffff" stroke-width="0.5" opacity="0.4"/>
      <use href="#iconChart" x="-18" y="-16" transform="scale(1.1)"/>
      <text x="0" y="32" text-anchor="middle" fill="#8892a4" font-family="Poppins, sans-serif" font-size="10" font-weight="500">Chart.js</text>
    </g>

    <!-- أيقونة Leaflet.js -->
    <g transform="translate(900, 70)">
      <rect x="-30" y="-28" width="60" height="52" rx="10" fill="url(#glassCard)" stroke="#ffffff" stroke-width="0.5" opacity="0.4"/>
      <use href="#iconLeaflet" x="-18" y="-16" transform="scale(1.1)"/>
      <text x="0" y="32" text-anchor="middle" fill="#8892a4" font-family="Poppins, sans-serif" font-size="10" font-weight="500">Leaflet.js</text>
    </g>

    <!-- أيقونة Responsive Design -->
    <g transform="translate(1080, 70)">
      <rect x="-30" y="-28" width="60" height="52" rx="10" fill="url(#glassCard)" stroke="#ffffff" stroke-width="0.5" opacity="0.4"/>
      <!-- أيقونة الشاشة المتجاوبة -->
      <rect x="-14" y="-14" width="28" height="22" rx="3" fill="none" stroke="#4cc9f0" stroke-width="1.5"/>
      <line x1="-8" y1="1" x2="8" y2="1" stroke="#4cc9f0" stroke-width="1.2"/>
      <line x1="-5" y1="6" x2="5" y2="6" stroke="#4cc9f0" stroke-width="1"/>
      <polyline points="-17,-6 -14,-14 -6,-14" fill="none" stroke="#4cc9f0" stroke-width="1.2"/>
      <polyline points="17,-6 14,-14 6,-14" fill="none" stroke="#4cc9f0" stroke-width="1.2"/>
      <text x="0" y="32" text-anchor="middle" fill="#8892a4" font-family="Poppins, sans-serif" font-size="9" font-weight="500">Responsive</text>
    </g>

    <!-- نص إضافي -->
    <text x="600" y="130" text-anchor="middle" fill="#8892a4" font-family="Poppins, sans-serif" font-size="9" opacity="0.4">
      Full-Stack Developer Portfolio · Interactive Data Visualization · Modern Web Technologies
    </text>
  </g>

  <!-- نقاط تنقل جانبية -->
  <g transform="translate(1170, 315)" opacity="0.6">
    <circle cx="0" cy="-40" r="4" fill="#c9a84c" opacity="0.9"/>
    <circle cx="0" cy="-20" r="4" fill="#c9a84c" opacity="0.5"/>
    <circle cx="0" cy="0" r="4" fill="#c9a84c" opacity="0.3"/>
    <circle cx="0" cy="20" r="4" fill="#c9a84c" opacity="0.3"/>
    <circle cx="0" cy="40" r="4" fill="#c9a84c" opacity="0.3"/>
  </g>
</svg>