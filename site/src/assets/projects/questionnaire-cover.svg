<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- تدرجات الخلفية -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    
    <linearGradient id="accentGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- مرشح الظلال -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- مسار منحني للزخرفة -->
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- خلفية -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  
  <!-- زخارف خلفية: دوائر شفافة -->
  <circle cx="150" cy="100" r="280" fill="#3b82f6" opacity="0.03" />
  <circle cx="1050" cy="500" r="320" fill="#8b5cf6" opacity="0.04" />
  <circle cx="600" cy="315" r="450" fill="#06b6d4" opacity="0.02" />
  
  <!-- خطوط شبكية دقيقة -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- منحنى زخرفي علوي -->
  <path d="M0,120 Q300,40 600,120 T1200,80 L1200,0 L0,0 Z" fill="url(#curveGrad)" opacity="0.15" />

  <!-- البطاقة المركزية -->
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
  
  <!-- شريط علوي ملون داخل البطاقة -->
  <rect x="60" y="60" width="1080" height="6" rx="3" fill="url(#accentGrad)" />

  <!-- محتوى البطاقة: تخطيط عمودين -->
  
  <!-- العمود الأيسر: النص والعنوان -->
  <g transform="translate(110, 130)">
    <!-- شارة صغيرة -->
    <rect x="0" y="0" width="190" height="32" rx="16" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1" />
    <text x="95" y="21" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#93c5fd" text-anchor="middle" letter-spacing="1.5">ENTERPRISE SURVEY</text>
    
    <!-- العنوان الرئيسي -->
    <text x="0" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="800" fill="#f1f5f9" letter-spacing="-0.5">
      Corporate Insight
    </text>
    <text x="0" y="110" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="800" fill="url(#accentGrad)" letter-spacing="-0.5">
      Questionnaire
    </text>
    
    <!-- خط فاصل -->
    <rect x="0" y="130" width="60" height="3" rx="2" fill="url(#accentGrad)" />
    
    <!-- الوصف -->
    <text x="0" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#94a3b8" line-height="1.6">
      An interactive, multi-step enterprise survey
    </text>
    <text x="0" y="190" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#94a3b8" line-height="1.6">
      featuring conditional logic, real-time validation,
    </text>
    <text x="0" y="215" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#94a3b8" line-height="1.6">
      and a modern, responsive UI design.
    </text>
    
    <!-- ميزات صغيرة -->
    <g transform="translate(0, 255)">
      <circle cx="10" cy="10" r="6" fill="#10b981" />
      <text x="25" y="15" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#cbd5e1">4 interactive sections with progress indicator</text>
      
      <circle cx="10" cy="38" r="6" fill="#10b981" />
      <text x="25" y="43" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#cbd5e1">Conditional fields &amp; smart validation</text>
      
      <circle cx="10" cy="66" r="6" fill="#10b981" />
      <text x="25" y="71" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#cbd5e1">Review summary before final submission</text>
        </g>
  </g>

  <!-- العمود الأيمن: رسوم توضيحية وأيقونات التقنيات -->
  
  <!-- أيقونة استبيان كبيرة (شكل تجريدي) -->
  <g transform="translate(800, 150)">
    <!-- بطاقة صغيرة تمثل نموذج -->
    <rect x="0" y="0" width="280" height="200" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="280" height="4" rx="2" fill="url(#accentGrad2)" />
    
    <!-- شريط تقدم مصغر -->
    <g transform="translate(20, 25)">
      <rect x="0" y="0" width="240" height="6" rx="3" fill="#334155" />
      <rect x="0" y="0" width="160" height="6" rx="3" fill="url(#accentGrad2)" />
      <circle cx="40" cy="3" r="8" fill="#3b82f6" />
      <circle cx="120" cy="3" r="8" fill="#3b82f6" />
      <circle cx="200" cy="3" r="8" fill="#475569" />
      <circle cx="240" cy="3" r="8" fill="#475569" />
      <!-- نقاط صغيرة داخل الدوائر -->
      <circle cx="40" cy="3" r="3" fill="#ffffff" />
      <circle cx="120" cy="3" r="3" fill="#ffffff" />
    </g>
    
    <!-- حقول نموذج وهمية -->
    <g transform="translate(20, 55)">
      <rect x="0" y="0" width="240" height="16" rx="4" fill="#334155" opacity="0.6" />
      <rect x="0" y="24" width="170" height="16" rx="4" fill="#334155" opacity="0.4" />
      <rect x="0" y="48" width="200" height="16" rx="4" fill="#334155" opacity="0.5" />
      
      <!-- أيقونة اختيار (راديو) -->
      <circle cx="220" cy="32" r="10" fill="none" stroke="#3b82f6" stroke-width="2" />
      <circle cx="220" cy="32" r="5" fill="#3b82f6" />
      
      <!-- حقل نص كبير -->
      <rect x="0" y="75" width="240" height="40" rx="4" fill="#334155" opacity="0.4" />
    </g>
    
    <!-- زر إرسال وهمي -->
    <rect x="180" y="155" width="80" height="28" rx="14" fill="url(#accentGrad)" />
    <text x="220" y="174" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">NEXT →</text>
  </g>

  <!-- أيقونة ثانية: رسم بياني صغير (رمز تحليلات) -->
  <g transform="translate(720, 380)">
    <rect x="0" y="0" width="100" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <!-- أعمدة بسيطة -->
    <rect x="12" y="35" width="14" height="30" rx="3" fill="#3b82f6" opacity="0.7" />
    <rect x="32" y="20" width="14" height="45" rx="3" fill="#8b5cf6" opacity="0.7" />
    <rect x="52" y="28" width="14" height="37" rx="3" fill="#06b6d4" opacity="0.7" />
    <rect x="72" y="10" width="14" height="55" rx="3" fill="#3b82f6" opacity="0.9" />
    <!-- خط اتجاه -->
    <polyline points="18,48 38,22 58,34 78,12" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="78" cy="12" r="4" fill="#f59e0b" />
  </g>

  <!-- شريط التقنيات المستخدمة -->
  <g transform="translate(110, 490)">
    <text x="0" y="0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="2" text-transform="uppercase">Built with</text>
    
    <!-- أيقونة HTML5 -->
    <g transform="translate(120, -16)">
      <rect x="0" y="0" width="70" height="28" rx="6" fill="#e34f26" fill-opacity="0.15" stroke="#e34f26" stroke-opacity="0.3" stroke-width="1" />
      <text x="35" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#e34f26" text-anchor="middle">HTML5</text>
    </g>
    
    <!-- أيقونة CSS3 -->
    <g transform="translate(200, -16)">
      <rect x="0" y="0" width="70" height="28" rx="6" fill="#264de4" fill-opacity="0.15" stroke="#264de4" stroke-opacity="0.3" stroke-width="1" />
      <text x="35" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#264de4" text-anchor="middle">CSS3</text>
    </g>
    
    <!-- أيقونة JavaScript -->
    <g transform="translate(280, -16)">
      <rect x="0" y="0" width="95" height="28" rx="6" fill="#f7df1e" fill-opacity="0.15" stroke="#f7df1e" stroke-opacity="0.3" stroke-width="1" />
      <text x="47" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#f7df1e" text-anchor="middle">JavaScript</text>
    </g>
    
    <!-- أيقونة SVG -->
    <g transform="translate(385, -16)">
      <rect x="0" y="0" width="70" height="28" rx="6" fill="#ffb13b" fill-opacity="0.15" stroke="#ffb13b" stroke-opacity="0.3" stroke-width="1" />
      <text x="35" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#ffb13b" text-anchor="middle">SVG</text>
    </g>
    
    <!-- أيقونة Responsive -->
    <g transform="translate(465, -16)">
      <rect x="0" y="0" width="100" height="28" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
      <text x="50" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">Responsive</text>
    </g>
  </g>

  <!-- زخرفة: نقاط صغيرة في الزاوية السفلى اليمنى -->
  <g transform="translate(1050, 520)">
    <circle cx="0" cy="0" r="3" fill="#3b82f6" opacity="0.4" />
    <circle cx="20" cy="0" r="3" fill="#8b5cf6" opacity="0.4" />
    <circle cx="10" cy="15" r="3" fill="#06b6d4" opacity="0.4" />
    <circle cx="30" cy="15" r="3" fill="#3b82f6" opacity="0.4" />
  </g>

</svg>