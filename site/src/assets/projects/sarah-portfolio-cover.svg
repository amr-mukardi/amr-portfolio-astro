<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="primaryLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    
    <linearGradient id="glassLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7" />
    </linearGradient>
    
    <!-- Shadows -->
    <filter id="shadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    
    <!-- Subtle Grid Pattern -->
    <pattern id="gridLight" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#cbd5e1" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgLight)" />
  <rect width="1200" height="600" fill="url(#gridLight)" />
  
  <!-- Decorative Orbs -->
  <circle cx="1000" cy="100" r="300" fill="#4f46e5" opacity="0.05" filter="blur(60px)" />
  <circle cx="200" cy="500" r="250" fill="#a855f7" opacity="0.05" filter="blur(60px)" />
  
  <!-- Left Side: Typography -->
  <g transform="translate(100, 220)">
    <!-- Badge -->
    <rect x="0" y="-70" width="220" height="34" rx="17" fill="#e0e7ff" />
    <text x="110" y="-48" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#4338ca" text-anchor="middle" letter-spacing="1">PORTFOLIO &amp; RESUME</text>
    
    <!-- Name -->
    <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" fill="#0f172a" letter-spacing="-1">Sarah Ahmed</text>
    
    <!-- Title -->
    <text x="0" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="url(#primaryLight)" letter-spacing="0.5">Executive Secretary</text>
    
    <!-- Divider -->
    <rect x="0" y="105" width="60" height="4" rx="2" fill="#cbd5e1" />
    
    <!-- Tagline -->
    <text x="0" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#475569" letter-spacing="0.5">
      Strategic Scheduling • Bilingual Communication • Office Management
    </text>
  </g>
  
  <!-- Right Side: Abstract UI Elements -->
  <g transform="translate(850, 300)">
    
    <!-- Large Calendar Card -->
    <g transform="translate(-50, -120)" filter="url(#shadowLight)">
      <rect width="200" height="160" rx="24" fill="url(#glassLight)" stroke="#f1f5f9" stroke-width="2" />
      
      <!-- Calendar Header -->
      <path d="M 0 24 Q 0 0 24 0 L 176 0 Q 200 0 200 24 L 200 50 L 0 50 Z" fill="#4f46e5" />
      <text x="30" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">APRIL 2024</text>
      
      <!-- Calendar Grid Lines -->
      <rect x="25" y="70" width="30" height="30" rx="6" fill="#e0e7ff" />
      <rect x="65" y="70" width="30" height="30" rx="6" fill="#e0e7ff" />
      <rect x="105" y="70" width="30" height="30" rx="6" fill="#4f46e5" />
      <rect x="145" y="70" width="30" height="30" rx="6" fill="#e0e7ff" />
      
      <rect x="25" y="110" width="30" height="30" rx="6" fill="#e0e7ff" />
      <rect x="65" y="110" width="30" height="30" rx="6" fill="#e0e7ff" />
      <rect x="105" y="110" width="30" height="30" rx="6" fill="#e0e7ff" />
      <rect x="145" y="110" width="30" height="30" rx="6" fill="#e0e7ff" />
    </g>
    
    <!-- Floating Task List Card -->
    <g transform="translate(-180, 100)" filter="url(#shadowLight)">
      <rect width="180" height="100" rx="20" fill="url(#glassLight)" stroke="#f1f5f9" stroke-width="2" />
      
      <!-- Task 1 (Done) -->
      <circle cx="30" cy="35" r="10" fill="#10b981" />
      <path d="M 25 35 L 29 39 L 35 31" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <rect x="55" y="30" width="85" height="8" rx="4" fill="#cbd5e1" />
      
      <!-- Task 2 (Pending) -->
      <circle cx="30" cy="65" r="10" fill="none" stroke="#94a3b8" stroke-width="2" />
      <rect x="55" y="60" width="65" height="8" rx="4" fill="#e2e8f0" />
    </g>
    
    <!-- Floating Email/Bell Card -->
    <g transform="translate(100, 80)" filter="url(#shadowLight)">
      <rect width="100" height="100" rx="20" fill="url(#glassLight)" stroke="#f1f5f9" stroke-width="2" />
      
      <!-- Mail Icon -->
      <path d="M 25 35 L 50 55 L 75 35" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <rect x="25" y="25" width="50" height="40" rx="8" fill="none" stroke="#7c3aed" stroke-width="3" />
      
      <!-- Notification Dot -->
      <circle cx="75" cy="25" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
    </g>
    
    <!-- Small Globe Card -->
    <g transform="translate(80, -80)" filter="url(#shadowLight)">
      <rect width="80" height="80" rx="16" fill="url(#glassLight)" stroke="#f1f5f9" stroke-width="2" />
      <circle cx="40" cy="40" r="18" stroke="#0ea5e9" stroke-width="2.5" fill="none" />
      <path d="M 22 40 Q 40 15 58 40 Q 40 65 22 40" stroke="#0ea5e9" stroke-width="2.5" fill="none" />
      <line x1="40" y1="22" x2="40" y2="58" stroke="#0ea5e9" stroke-width="2.5" />
    </g>
    
  </g>
</svg>